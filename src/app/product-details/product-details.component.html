<div class="card h-100 shadow-sm">

  <div class="ratio ratio-4x3 bg-body-tertiary rounded-top">
    <img
      [src]="product.image || 'assets/images/no-image.png'"
      [alt]="product.name"
      class="p-3 object-fit-contain"
  
      >
  </div>

  <div class="card-body d-flex flex-column">
    <h3 class="h6 fw-semibold mb-1 text-truncate" [title]="product.name">
      {{ product.name }}
    </h3>

    <div class="fs-5 fw-bold text-success mb-3">
      {{ product.price }}
    </div>

    <div class="d-flex justify-content-between border-top pt-3 mt-auto">
      <div>
        <div class="small text-body-secondary">Quantity</div>
        <div class="small fw-semibold">{{ product.quantity }}</div>
      </div>
      <div class="text-end">
        <div class="small text-body-secondary">Code</div>
        <div class="small fw-semibold">{{ product.code }}</div>
      </div>
    </div>
  </div>

</div>
